name: Build and publish pstress-ch binary

on:
  push:
    branches: [master]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ make git libabsl-dev libssl-dev zlib1g-dev

      - name: Build and install clickhouse-cpp
        run: |
          git clone --depth=1 https://github.com/ClickHouse/clickhouse-cpp.git /tmp/clickhouse-cpp
          cmake -S /tmp/clickhouse-cpp -B /tmp/clickhouse-cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_OPENSSL=ON
          cmake --build /tmp/clickhouse-cpp/build --parallel $(nproc)
          sudo cmake --install /tmp/clickhouse-cpp/build

      - name: Build pstress-ch
        run: |
          mkdir -p bld && cd bld
          cmake .. -DCLICKHOUSE=ON \
            -DCLICKHOUSE_INCLUDE_DIR=/usr/local/include \
            -DCLICKHOUSE_LIBRARY=/usr/local/lib/libclickhouse-cpp-lib.a \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRICT_CPU=OFF
          make -j$(nproc)

      - name: Verify binary
        run: |
          ldd bld/src/pstress-ch
          ls -lh bld/src/pstress-ch
          # Without OpenSSL in clickhouse-cpp, --secure silently opens a
          # plaintext socket; refuse to publish such a binary.
          ldd bld/src/pstress-ch | grep -q libssl
          # No pipefail in the default shell: run --help on its own so a
          # failing executable fails the step, then show the banner.
          bld/src/pstress-ch --help > help.txt
          head -2 help.txt

      - name: Upload binary to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Latest assets are clobbered on every push. pstress auto-loads every
          # .txt/.sql beside the executable and the table-settings pool draws
          # from the RNG per table, so the side files travel with the binary.
          gh release upload v1.0-clickhouse \
            bld/src/pstress-ch src/english_dictionary.txt \
            src/clickhouse_*.txt src/clickhouse_*.sql --clobber
          # pstress-ch-<sha>.tar.gz is one immutable bundle of the binary and
          # the side files it was built with, so a consumer that pins a sha
          # reproduces the same schema for the same seed. Never overwritten:
          # clickhouse-cpp comes from a moving branch, so a rerun for the same
          # commit could produce different bytes.
          SHA=$(git rev-parse --short=7 HEAD)
          BUNDLE="pstress-ch-${SHA}.tar.gz"
          if gh release view v1.0-clickhouse --json assets \
               --jq '.assets[].name' | grep -qx "${BUNDLE}"; then
            echo "${BUNDLE} already published, keeping it"
          else
            mkdir -p "bundle/pstress-ch-${SHA}"
            cp bld/src/pstress-ch src/english_dictionary.txt \
               src/clickhouse_*.txt src/clickhouse_*.sql "bundle/pstress-ch-${SHA}/"
            tar -C bundle -czf "${BUNDLE}" "pstress-ch-${SHA}"
            gh release upload v1.0-clickhouse "${BUNDLE}"
          fi
