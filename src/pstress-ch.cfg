# Sample pstress-ch config. Run with:
#   pstress-ch --config-file pstress-ch.cfg --port 9000 --logdir /tmp/pstress-ch
#
# Every key under [pstress] is a long option by name (see --help or
# --dump-options-json). A flag on the command line overrides the file.
# Unknown keys and bad values abort the run.
#
# Connection flags (--address, --port, --secure, --user, --password,
# --database, --logdir, --step) are usually left to the command line so the
# same file runs against any server.

[pstress]
# Schema: 10 tables, 100K initial rows each, no JSON columns.
tables = 10
records = 100K
no-json = true

# Workload: 5 threads for 300 seconds. seconds = 0 only creates and loads.
threads = 5
seconds = 300

# Materialized views need the server setting
# materialized_views_populate_atomically; set create-mv = 0 on older builds.
create-mv = 1

# Mutations: ALTER UPDATE / DELETE with mutations_sync=2 (weights, 0 = off).
ch-alter-update = 0
ch-alter-delete = 0
ch-mutations-sync = false

# Checks: verify replica count+checksum every N seconds (0 = only at end).
ch-verify-interval = 0
