name: Build and publish pstress-ch binary

on:
  push:
    branches: [master]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ make git libabsl-dev libssl-dev zlib1g-dev

      - name: Build and install clickhouse-cpp
        run: |
          git clone --depth=1 https://github.com/ClickHouse/clickhouse-cpp.git /tmp/clickhouse-cpp
          cmake -S /tmp/clickhouse-cpp -B /tmp/clickhouse-cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_OPENSSL=ON
          cmake --build /tmp/clickhouse-cpp/build --parallel $(nproc)
          sudo cmake --install /tmp/clickhouse-cpp/build

      - name: Build pstress-ch
        run: |
          mkdir -p bld && cd bld
          cmake .. -DCLICKHOUSE=ON \
            -DCLICKHOUSE_INCLUDE_DIR=/usr/local/include \
            -DCLICKHOUSE_LIBRARY=/usr/local/lib/libclickhouse-cpp-lib.a \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRICT_CPU=OFF
          make -j$(nproc)

      - name: Verify binary
        run: |
          ldd bld/src/pstress-ch
          ls -lh bld/src/pstress-ch
          # Without OpenSSL in clickhouse-cpp, --secure silently opens a
          # plaintext socket; refuse to publish such a binary.
          ldd bld/src/pstress-ch | grep -q libssl
          # No pipefail in the default shell: run --help on its own so a
          # failing executable fails the step, then show the banner.
          bld/src/pstress-ch --help > help.txt
          head -2 help.txt

      - name: Upload binary to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pstress-ch is always the latest; pstress-ch-<sha> stays behind so a
          # consumer can pin the exact build it tested with. The sha asset is
          # uploaded without --clobber: clickhouse-cpp comes from a moving
          # branch, so a rerun for the same commit must not replace the bytes
          # a consumer already tested.
          SHA=$(git rev-parse --short=7 HEAD)
          cp bld/src/pstress-ch "bld/src/pstress-ch-${SHA}"
          # pstress auto-loads every .txt/.sql beside the executable, and the
          # table-settings pool draws from the RNG per table, so a consumer
          # without the same side files gets a different schema for the same
          # seed. Ship them all with the binary.
          gh release upload v1.0-clickhouse \
            bld/src/pstress-ch src/english_dictionary.txt \
            src/clickhouse_*.txt src/clickhouse_*.sql --clobber
          if gh release view v1.0-clickhouse --json assets \
               --jq '.assets[].name' | grep -qx "pstress-ch-${SHA}"; then
            echo "pstress-ch-${SHA} already published, keeping it"
          else
            gh release upload v1.0-clickhouse "bld/src/pstress-ch-${SHA}"
          fi
